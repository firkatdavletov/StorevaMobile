    primaryColor: "#111111"
    accentColor: "#D5AF5D"
    backgroundColor: "#FAF9F6"
    cornerRadius: 0

features:
    payments: true
    bonuses: false
    pickupPoints: true
    restaurantMode: false
    tableOrders: false
    waiterApp: false